name: Windows distribution
on:
  push:
    branches: [main, codex/separate-projects-installers]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies and run tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_flame.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone application
        run: python packaging/build.py
      - name: Include instructions and notices
        shell: pwsh
        run: Copy-Item LEIA-ME.txt,LEGAL-NOTICE.md,LICENSE 'dist-current/FlameLang/'
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 missing on runner' }
          & $compiler /Qp packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installation, restart and uninstall
        run: python packaging/smoke_install.py
      - name: Build portable ZIP and checksums
        run: python packaging/portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlameLang-windows-x64
          path: release/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FlameLang-windows-x64
          path: release
      - name: Create reviewed-candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-rc.1 release/* --target "$GITHUB_SHA" --draft --prerelease --title 'FlameLang 0.2.0-rc.1 · Windows x64' --notes-file RELEASE-NOTES.md
